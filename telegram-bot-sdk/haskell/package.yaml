name:                devflow-telegram-bot
version:             0.1.0.0
synopsis:            Devflow Finance Twin - Telegram Bot (Haskell)
description:         Functional Telegram bot for sprint/issue tracking with Ollama fallback
license:             GPL-3.0
author:              SNAPKITTYWEST
maintainer:          SNAPKITTYWEST
category:            Network
build-type:          Simple
extra-source-files:  README.md

ghc-options: -Wall -Wcompat -Widentities -Wincomplete-record-updates
             -Wincomplete-uni-patterns -Wmissing-export-lists
             -Wmissing-home-modules -Wpartial-fields -Wredundant-constraints

dependencies:
  - base >= 4.14 && < 5
  - telegram-bot-simple >= 0.7
  - stm >= 2.5
  - aeson >= 2.0
  - text >= 1.2
  - time >= 1.9
  - uuid >= 1.3
  - sqlite-simple >= 0.4
  - async >= 2.2
  - http-client >= 0.7
  - http-client-tls >= 0.3
  - http-types >= 0.12
  - bytestring >= 0.10
  - containers >= 0.6
  - mtl >= 2.2
  - transformers >= 0.5
  - unliftio >= 0.2
  - unliftio-core >= 0.2

library:
  source-dirs: src
  exposed-modules:
    - Bot
    - Agent
    - Types
    - Commands.Scrum
    - Commands.Issue
    - Lib.Ollama
    - Lib.Persistence

executables:
  devflow-telegram-bot:
    main:                Main.hs
    source-dirs:         src
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - devflow-telegram-bot

tests:
  devflow-telegram-bot-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - devflow-telegram-bot
      - hspec >= 2.9
      - hspec-discover >= 2.9
      - QuickCheck >= 2.14
