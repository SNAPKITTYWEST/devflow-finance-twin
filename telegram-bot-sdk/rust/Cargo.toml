[package]
name = "telegram-bot-sdk"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Unified Telegram bot SDK with agent framework, scrum board, and Ollama LLM integration"
license = "Apache-2.0 OR GPL-3.0-or-later"
repository = "https://github.com/SNAPKITTYWEST/devflow-finance-twin"
keywords = ["telegram", "bot", "scrum", "agent", "ollama"]
categories = ["web-programming", "api-bindings"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Telegram bot framework
teloxide = { version = "0.12", features = ["macros", "ctrlc_handler"] }

# Async traits
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# HTTP client for Ollama
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Database
sqlx = { version = "0.7", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "chrono",
    "uuid",
    "migrate",
] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
parking_lot = "0.12"
dotenv = "0.15"

[dev-dependencies]
mockall = "0.12"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[lib]
name = "telegram_bot_sdk"
path = "src/lib.rs"

[[example]]
name = "basic_bot"
path = "examples/basic_bot.rs"

[[example]]
name = "full_featured"
path = "examples/full_featured.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"
