[package]
name = "telegram-bot-sdk"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Unified Telegram bot SDK with agent framework"
license = "MIT OR Apache-2.0 OR GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.27", features = ["macros"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenv = "0.15"
reqwest = { version = "0.11", features = ["json"] }
once_cell = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"

[dev-dependencies]
mockall = "0.12"
tempfile = "3"

[lib]
name = "telegram_bot_sdk"
path = "src/lib.rs"

[[example]]
name = "basic_bot"
path = "examples/basic_bot.rs"

[[example]]
name = "with_agent"
path = "examples/with_agent.rs"

[[example]]
name = "full_featured"
path = "examples/full_featured.rs"
