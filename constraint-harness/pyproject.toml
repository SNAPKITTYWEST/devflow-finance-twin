[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constraint-harness"
version = "0.1.0"
description = "Deterministic MXML / Datalog / Python constraint harness with optional PyTorch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Constraint Harness Contributors"}]
dependencies = []

[project.optional-dependencies]
pytorch = ["torch>=2.0"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
harness = "constraint_harness.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mxml*", "constitution*", "runtime*", "scheduler*", "commands*", "isolation*", "verification*", "audit*", "adapters*", "constraint_harness*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
