<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- sql_schema.svg -->
<svg width="1200pt" height="400pt" viewBox="0.00 0.00 1200.00 400.00" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L6,3 z" fill="#000"/>
    </marker>
  </defs>
  <g font-family="Helvetica" font-size="11">
    <rect x="8" y="8" width="1184" height="384" fill="#ffffff" stroke="none"/>
    <!-- KrausArtifact -->
    <g transform="translate(40,40)">
      <rect x="0" y="0" width="260" height="100" rx="6" ry="6" fill="#f0f0f0" stroke="#000"/>
      <text x="12" y="20" font-weight="bold">KrausArtifact</text>
      <text x="12" y="36">id PK</text>
      <text x="12" y="52">theta</text>
      <text x="12" y="68">created_at</text>
      <text x="12" y="84">commit_hash, artifact_path</text>
    </g>
    <!-- KrausMatrix -->
    <g transform="translate(360,40)">
      <rect x="0" y="0" width="300" height="120" rx="6" ry="6" fill="#f0f0f0" stroke="#000"/>
      <text x="12" y="20" font-weight="bold">KrausMatrix</text>
      <text x="12" y="36">id PK</text>
      <text x="12" y="52">artifact_id FK</text>
      <text x="12" y="68">m_index</text>
      <text x="12" y="84">row, col</text>
      <text x="12" y="100">re, im</text>
    </g>
    <!-- Provenance -->
    <g transform="translate(720,40)">
      <rect x="0" y="0" width="300" height="100" rx="6" ry="6" fill="#f0f0f0" stroke="#000"/>
      <text x="12" y="20" font-weight="bold">Provenance</text>
      <text x="12" y="36">id PK</text>
      <text x="12" y="52">artifact_id FK</text>
      <text x="12" y="68">seed</text>
      <text x="12" y="84">toolchain, env_json</text>
    </g>
    <!-- Trials -->
    <g transform="translate(40,180)">
      <rect x="0" y="0" width="260" height="100" rx="6" ry="6" fill="#f0f0f0" stroke="#000"/>
      <text x="12" y="20" font-weight="bold">Trials</text>
      <text x="12" y="36">id PK</text>
      <text x="12" y="52">artifact_id FK</text>
      <text x="12" y="68">trial_no, timestamp</text>
      <text x="12" y="84">bits_json</text>
    </g>
    <!-- EMAState -->
    <g transform="translate(360,220)">
      <rect x="0" y="0" width="300" height="80" rx="6" ry="6" fill="#f0f0f0" stroke="#000"/>
      <text x="12" y="20" font-weight="bold">EMAState</text>
      <text x="12" y="36">id PK</text>
      <text x="12" y="52">trial_id FK</text>
      <text x="12" y="68">archetype_id, p_value</text>
    </g>
    <!-- Archetype -->
    <g transform="translate(720,220)">
      <rect x="0" y="0" width="300" height="80" rx="6" ry="6" fill="#f0f0f0" stroke="#000"/>
      <text x="12" y="20" font-weight="bold">Archetype</text>
      <text x="12" y="36">id PK</text>
      <text x="12" y="52">name</text>
      <text x="12" y="68">description</text>
    </g>
    <!-- Users -->
    <g transform="translate(40,310)">
      <rect x="0" y="0" width="260" height="60" rx="6" ry="6" fill="#f0f0f0" stroke="#000"/>
      <text x="12" y="20" font-weight="bold">Users</text>
      <text x="12" y="36">id PK</text>
      <text x="12" y="52">name, role</text>
    </g>
    <!-- Relationships -->
    <line x1="300" y1="90"  x2="360" y2="90"  stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="305" y="85" font-size="9">1..*</text>
    <line x1="300" y1="100" x2="360" y2="100" stroke="none"/>
    <line x1="660" y1="90"  x2="720" y2="90"  stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="665" y="85" font-size="9">1..1</text>
    <line x1="150" y1="140" x2="150" y2="180" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="155" y="165" font-size="9">1..*</text>
    <line x1="300" y1="230" x2="360" y2="260" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="305" y="245" font-size="9">1..*</text>
    <line x1="660" y1="260" x2="720" y2="260" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="665" y="255" font-size="9">FK</text>
    <line x1="150" y1="280" x2="150" y2="310" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="155" y="300" font-size="9">owner</text>
  </g>
</svg>
