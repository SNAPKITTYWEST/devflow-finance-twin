[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-rsi"
version = "0.1.0"
description = "Recursive Self-Improvement dream engine"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0,<9.0.0"]

[tool.setuptools.packages.find]
where = [".."]
include = ["dream_rsi*"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
